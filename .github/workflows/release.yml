name: Build and publish release JAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Verify and name release asset
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]
          source="target/ATOR-${RELEASE_TAG}-jar-with-dependencies.jar"
          test -s "$source"
          jar tf "$source" > "$RUNNER_TEMP/ator-jar-contents.txt"
          grep -Fxq 'burp/BurpExtender.class' "$RUNNER_TEMP/ator-jar-contents.txt"
          grep -Fxq 'org/json/JSONObject.class' "$RUNNER_TEMP/ator-jar-contents.txt"
          grep -Fxq 'org/json/simple/JSONObject.class' "$RUNNER_TEMP/ator-jar-contents.txt"
          if grep -Fq 'burp/api/montoya/' "$RUNNER_TEMP/ator-jar-contents.txt"; then
            echo 'The provided Montoya API was unexpectedly bundled.' >&2
            exit 1
          fi
          cp "$source" "ATOR-${RELEASE_TAG}.jar"
          sha256sum "ATOR-${RELEASE_TAG}.jar" > "ATOR-${RELEASE_TAG}.jar.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "ATOR-${RELEASE_TAG}.jar" \
            "ATOR-${RELEASE_TAG}.jar.sha256" \
            --verify-tag --generate-notes --title "ATOR ${RELEASE_TAG}"
